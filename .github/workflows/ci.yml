name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The same versions as the Python classifiers in `pyproject.toml`.
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # `--no-editable` installs the built wheel, so the tests import what PyPI would get.
      - run: uv sync --locked --no-editable --all-extras
      - run: uv run --no-sync pytest

  # The next CPython, from its first beta to its final release, in a job that may fail.
  next-python:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
      - run: uv sync --locked --no-editable --all-extras
      - run: uv run --no-sync pytest

  # Each runtime floor in `pyproject.toml` but httpx2's is the oldest version that passes, so this job tests the floors (CONTRIBUTING.md).
  lowest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          cache-suffix: lowest
      - run: uv sync --resolution lowest-direct --no-editable --all-extras
      - run: uv run --no-sync pytest

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      # Editable, so the report names the files under `src/`, where Codecov finds them.
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync coverage run -m pytest
      - run: uv run --no-sync coverage xml
      # Codecov only draws the badge and comments on pull requests, so a failed upload fails no check.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          use_oidc: true
      # After the upload, so Codecov's comment shows the missed lines of a pull request that fails here.
      - run: uv run --no-sync coverage report --fail-under=100

  # Local hooks miss a `--no-verify` commit and a fork's commits, so CI runs every hook on every file.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # pyrefly resolves the CLI's imports of typer and rich only when the extras are installed.
      - run: uv sync --locked --all-extras
      - run: uv run --no-sync prek run --all-files --show-diff-on-failure

  # The build runs every example, so an example that stops working fails its PR.
  docs:
    runs-on: ubuntu-latest
    # Quarto sets no timeout on a cell.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # great-docs reads the git history for page dates.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          cache-suffix: docs
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.18"
      - run: uv sync --locked --group docs
      - run: uv run --no-sync great-docs build
        env:
          # great-docs reads GitHub Releases for the changelog page, and an anonymous runner gets 60 requests an hour.
          GITHUB_TOKEN: ${{ github.token }}

  # The ruleset requires this one job, so a change to the jobs above never touches the ruleset.
  all-green:
    if: always()
    needs: [test, next-python, lowest, coverage, lint, docs]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-failures: next-python
          jobs: ${{ toJSON(needs) }}
