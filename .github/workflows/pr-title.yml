name: PR title

# The squash commit takes the PR title, and release-please reads that commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The `commit-msg` hook from `prek.toml` checks the title, so titles and local commits follow one rule set.
      - run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title.txt"
          uv run --locked --only-dev prek run --stage commit-msg --commit-msg-filename "$RUNNER_TEMP/title.txt" conventional-pre-commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
