name: Release

# PyPI's trusted publisher names this file. The release PR already passed the full matrix, so this workflow runs no tests.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # A release must not restore a cache that a pull request run could have written.
          enable-cache: false
      - run: uv build
      # No test reads `py.typed`, so this check keeps it in the wheel.
      - run: unzip -l dist/*.whl | grep -q 'oxyscraper/py.typed'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # The environment accepts `v*` tags only and waits for the maintainer's approval.
    environment:
      name: pypi
      url: https://pypi.org/p/oxyscraper
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The PyPA action makes PEP 740 attestations by default, and `uv publish` does not.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
