name: Release

# PyPI's trusted publisher names this file. The release PR already passed the full matrix, so this workflow runs no tests.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # A release must not restore a cache that a pull request run could have written.
          enable-cache: false
      - run: uv build
      # No test reads `py.typed`, so this check keeps it in the wheel.
      - run: unzip -l dist/*.whl | grep -q 'oxyscraper/py.typed'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # The environment accepts `v*` tags only and waits for the maintainer's approval.
    environment:
      name: pypi
      url: https://pypi.org/p/oxyscraper
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # The PyPA action makes PEP 740 attestations by default, and `uv publish` does not.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
