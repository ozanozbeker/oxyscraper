default_language_version.python = "3.11"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

# --- Conventional Commits ---
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"  # frozen: v4.4.0
hooks = [
  {
    id = "conventional-pre-commit",
    stages = ["commit-msg"],
    args = [
      "--strict",
    ]
  }
]

# --- Gitleaks ---
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1
hooks = [{ id = "gitleaks" }]

# --- Zizmor ---
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1
hooks = [{ id = "zizmor" }]

# --- actionlint ---
# zizmor checks workflows for security problems, and actionlint checks that they are valid.
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
hooks = [{ id = "actionlint" }]

# --- Pre-Commit ---
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-merge-conflict" },
  { id = "check-yaml" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files" },
]

# --- Local Tools ---
[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-check",
    name = "ruff check",
    entry = "uv run ruff check --fix --force-exclude",
    language = "system",
    types_or = ["python", "pyi", "jupyter"],
    require_serial = true,
  },
  {
    id = "ruff-format",
    name = "ruff format",
    entry = "uv run ruff format --force-exclude",
    language = "system",
    types_or = ["python", "pyi", "jupyter", "markdown"],
    require_serial = true,
  },
  {
    id = "rumdl",
    name = "rumdl",
    entry = "uv run rumdl check --fix",
    language = "system",
    types = ["markdown"],
    require_serial = true,
  },
  {
    id = "tombi-lint",
    name = "tombi lint",
    entry = "uv run tombi lint",
    language = "system",
    types = ["toml"],
  },
  {
    id = "tombi-format",
    name = "tombi format",
    entry = "uv run tombi format",
    language = "system",
    types = ["toml"],
  },
  {
    id = "uv-lock",
    name = "uv lock --check",
    entry = "uv lock --check",
    language = "system",
    files = '^(.*/)?(pyproject\.toml|uv\.lock)$',
    pass_filenames = false,
  },
  {
    id = "pyrefly",
    name = "pyrefly",
    entry = "uv run pyrefly check",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },
  # Each line marked `# E:` must fail to type-check and every other line must pass, so the types a caller sees stay public API.
  {
    id = "pyrefly-typing",
    name = "pyrefly typing tests",
    entry = "uv run pyrefly check --expectations tests/typing/",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },
]
