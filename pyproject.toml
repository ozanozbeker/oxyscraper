[project]
name = "oxyscraper"
version = "0.0.1"
description = "Unofficial Python library and CLI for the Oxylabs Web Scraper API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
keywords = ["oxylabs", "scraping", "web-scraper-api"]
# The Python classifiers and the test matrix in `ci.yml` list the same versions (CONTRIBUTING.md).
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Changelog = "https://ozanozbeker.com/oxyscraper/changelog.html"
Documentation = "https://ozanozbeker.com/oxyscraper/"
Issues = "https://github.com/ozanozbeker/oxyscraper/issues"
Repository = "https://github.com/ozanozbeker/oxyscraper"

[dependency-groups]
dev = [
  "prek>=0.5.2",
  "pyrefly>=1.2.0",
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "rumdl>=0.2.68",
  "tombi>=1.5.2",
]
# Not in `dev`, so the test and lint jobs skip Quarto's Jupyter stack.
docs = ["great-docs>=0.17"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
# A new upstream deprecation fails the Dependabot PR that brings it in, before the removal breaks oxy.
filterwarnings = ["error"]
testpaths = ["tests"]
xfail_strict = true
