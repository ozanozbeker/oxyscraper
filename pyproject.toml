[project]
name = "oxyscraper"
version = "0.0.1"
description = "Unofficial Python library and CLI for the Oxylabs Web Scraper API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ozan Ozbeker", email = "github@ozanozbeker.com" }]
keywords = ["oxylabs", "scraping", "web-scraper-api"]
# The Python classifiers and the test matrix in `ci.yml` list the same versions (CONTRIBUTING.md).
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.10.0",
  "httpx2[http2]>=2.12.0",
  "obstore>=0.4.0",
  "pydantic>=2.7.0",
  "typing-extensions>=4.6.1",
]

[project.urls]
Changelog = "https://ozanozbeker.com/oxyscraper/changelog.html"
Documentation = "https://ozanozbeker.com/oxyscraper/"
Issues = "https://github.com/ozanozbeker/oxyscraper/issues"
Repository = "https://github.com/ozanozbeker/oxyscraper"

[project.scripts]
oxy = "oxyscraper._main:main"
oxyscraper = "oxyscraper._main:main"

[project.optional-dependencies]
cli = ["rich>=13.8.0", "typer>=0.26.0"]

[dependency-groups]
# `prek-update.yml` sets each floor to its version in `uv.lock` monthly (CONTRIBUTING.md).
dev = [
  "coverage>=7.16.1",
  "prek>=0.5.3",
  "pyrefly>=1.3.1",
  "pytest>=9.1.1",
  "ruff>=0.16.8",
  "rumdl>=0.2.77",
  "tombi>=1.5.5",
  "trio>=0.34.0",
]
# Not in `dev`, so the test and lint jobs skip Quarto's Jupyter stack.
docs = ["great-docs>=0.17"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.coverage.run]
source_pkgs = ["oxyscraper"]

[tool.coverage.report]
# Every other exclusion is a `# pragma: no cover` that a reviewer sees.
exclude_also = ["if TYPE_CHECKING:"]
show_missing = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib", "-m", "not live"]
# A new upstream deprecation fails the Dependabot PR that brings it in, before the removal breaks oxy.
filterwarnings = ["error"]
markers = ["live: calls the Oxylabs API and bills the account, so only `-m live` selects it"]
testpaths = ["tests"]
xfail_strict = true
